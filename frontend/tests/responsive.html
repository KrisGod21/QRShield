<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>QR Shield responsive validation</title><style>body{margin:0;background:#090b08;color:#e2dbc6;font:14px system-ui}header{height:60px;box-sizing:border-box;padding:14px;display:flex;gap:12px;align-items:center;white-space:nowrap;overflow:auto}header>*{flex-shrink:0}button{background:#e8ca96;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}iframe{display:block;border:0;width:1440px;height:900px}#size{padding-left:10px}</style></head><body><header><button data-width="1440" data-height="900">Desktop 1440</button><button data-width="768" data-height="1024">Tablet 768</button><button data-width="390" data-height="844">Mobile 390</button><button data-width="320" data-height="800">Mobile 320</button><span id="size">Desktop 1440</span><button id="measure">Check layout</button></header><iframe src="/" title="QR Shield responsive preview"></iframe><script>
const frame = document.querySelector('iframe');
for (const button of document.querySelectorAll('[data-width]')) button.onclick = () => { frame.style.width = `${button.dataset.width}px`; frame.style.height = `${button.dataset.height}px`; document.querySelector('#size').textContent = button.textContent; };
document.querySelector('#measure').onclick = () => { const doc = frame.contentDocument; const width = doc.documentElement.clientWidth; const elements = [...doc.querySelectorAll('a,button,input,textarea,h1,h2,p')].filter(el => { const r=el.getBoundingClientRect(); return r.width > 0 && (r.left < -1 || r.right > width + 1); }); document.querySelector('#size').textContent = `${width}px · content width ${doc.documentElement.scrollWidth}px · ${elements.length} overflowing controls/text`; };
</script></body></html>
